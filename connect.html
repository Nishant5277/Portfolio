<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Let's Connect - MacroBox</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,200..900;1,7..72,200..900&family=Inter:wght@300;400;500&display=swap');
    
    body {
      font-family: 'Inter', sans-serif;
      background-color: #F6F3EC;
      color: #2C4A3B;
    }
    h1, h2, h3, h4, h5, h6, .serif-text {
      font-family: 'Literata', serif;
    }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {DEFAULT: "#2C4A3B", bg: "#F6F3EC", dim: "#dfdacd"},
            accent: "#c5523f",
            success: "#39B54A" 
          }
        }
      }
    };
  </script>
  <link rel="icon" href="assets/Logo.png" type="image/png">
</head>
<body class="antialiased flex flex-col min-h-screen relative">
  <!-- Subtle Background Pattern -->
  <div class="fixed inset-0 pointer-events-none opacity-[0.03] mix-blend-multiply" style="background-image: url('data:image/svg+xml,%3Csvg width=\'60\' height=\'60\' viewBox=\'0 0 60 60\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cg fill=\'none\' fill-rule=\'evenodd\'%3E%3Cg fill=\'%232C4A3B\' fill-opacity=\'1\'%3E%3Cpath d=\'M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z\'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E');"></div>

  <!-- Header -->
  <header class="py-5 px-6 md:px-8 flex justify-between items-center fixed w-full top-0 z-50 bg-[#F6F3EC]/90 backdrop-blur-md border-b border-brand/10">
    <a class="text-sm font-medium tracking-widest uppercase" href="index.html?fastLoad=true"><img src="assets/Logo.png" alt="MacroBox Logo" class="h-6 w-auto object-contain inline-block mr-2 -mt-1">MacroBox</a>
    <a href="index.html?fastLoad=true" class="text-xs md:text-sm border border-brand/20 px-4 py-2 rounded-full hover:bg-brand hover:text-brand-bg transition-colors">&larr; Back to Home</a>
  </header>

  <main class="flex-grow pt-32 pb-20 relative z-10 flex items-center justify-center px-4 md:px-8">
    
    <div class="w-full max-w-4xl bg-[#FCFAF6] border border-brand/10 shadow-xl rounded-2xl p-8 md:p-12 lg:p-16 relative overflow-hidden">
      
      <!-- Decorative Element -->
      <div class="absolute top-0 right-0 w-64 h-64 bg-brand/5 rounded-bl-full pointer-events-none"></div>

      <div class="text-center mb-12">
        <h1 class="text-4xl md:text-5xl serif-text mb-4">Let's Connect</h1>
        <p class="text-sm opacity-70 font-light">Tell us about your project, and we'll get back to you.</p>
      </div>

      <!-- Contact Form using FormSubmit -->
      <form action="https://formsubmit.co/macrobox.com@gmail.com" method="POST" class="space-y-8 relative z-10">
        
        <!-- Disable captcha for seamless experience -->
        <input type="hidden" name="_captcha" value="false">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
          <!-- Full Name -->
          <div>
            <label class="block text-xs font-medium tracking-widest uppercase opacity-70 mb-2">Full Name *</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none opacity-50">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
              </div>
              <input type="text" name="name" required placeholder="Enter your full name" class="w-full pl-12 pr-4 py-4 bg-transparent border border-brand/20 rounded-lg focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand transition-colors text-sm">
            </div>
          </div>

          <!-- Email Address -->
          <div>
            <label class="block text-xs font-medium tracking-widest uppercase opacity-70 mb-2">Email Address *</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none opacity-50">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
              </div>
              <input type="email" name="email" required placeholder="Enter your email address" class="w-full pl-12 pr-4 py-4 bg-transparent border border-brand/20 rounded-lg focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand transition-colors text-sm">
            </div>
          </div>
        </div>

        <!-- Phone Number -->
        <div>
          <label class="block text-xs font-medium tracking-widest uppercase opacity-70 mb-2">Phone Number *</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none opacity-50">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
            </div>
            <input type="tel" name="phone" required placeholder="Enter your phone number" class="w-full pl-12 pr-4 py-4 bg-transparent border border-brand/20 rounded-lg focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand transition-colors text-sm">
          </div>
        </div>

        <!-- Message -->
        <div>
          <label class="block text-xs font-medium tracking-widest uppercase opacity-70 mb-2">Message/Comment *</label>
          <div class="relative">
            <div class="absolute top-4 left-0 pl-4 pointer-events-none opacity-50">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
            </div>
            <textarea name="message" required rows="5" placeholder="Tell us about your project or ask us anything..." class="w-full pl-12 pr-4 py-4 bg-transparent border border-brand/20 rounded-lg focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand transition-colors text-sm resize-none"></textarea>
          </div>
        </div>

        <!-- Submit Button -->
        <div>
          <button type="submit" class="bg-[#39B54A] hover:bg-[#2e9c3c] text-white px-8 py-4 rounded-full font-medium transition-colors flex items-center gap-2 shadow-lg shadow-[#39B54A]/20">
            Send Message 
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
          </button>
        </div>

      </form>

      <!-- Footer Details -->
      <div class="mt-12 pt-8 border-t border-brand/10 grid grid-cols-1 md:grid-cols-2 gap-8 text-sm">
        <div>
          <h4 class="font-medium mb-1">Quick Response</h4>
          <p class="opacity-70 font-light">We typically respond within 24 hours</p>
        </div>
        <div>
          <h4 class="font-medium mb-1">Direct Contact</h4>
          <a href="mailto:macrobox.com@gmail.com" class="opacity-70 font-light hover:opacity-100 hover:text-accent transition-colors">macrobox.com@gmail.com</a>
        </div>
      </div>

    </div>

  </main>
</body>
</html>
